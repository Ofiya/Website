<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - Message Sent | CCC Redemption Parish Winnipeg</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .thank-you-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: linear-gradient(135deg, var(--primary-ivory) 0%, var(--secondary-sage) 100%);
        }
        
        .thank-you-card {
            background: white;
            padding: 4rem 3rem;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 600px;
            animation: fadeInUp 0.6s ease;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .success-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--secondary-sage), var(--accent-goldenrod));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
            animation: scaleIn 0.5s ease 0.2s both;
        }
        
        @keyframes scaleIn {
            from {
                transform: scale(0);
            }
            to {
                transform: scale(1);
            }
        }
        
        .success-icon i {
            font-size: 2.5rem;
            color: white;
        }
        
        .thank-you-card h1 {
            font-family: 'Cinzel', serif;
            font-size: 2.5rem;
            color: var(--accent-burgundy);
            margin-bottom: 1rem;
        }
        
        .thank-you-card p {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
            line-height: 1.8;
        }
        
        .btn-home {
            display: inline-block;
            padding: 1rem 2.5rem;
            background: linear-gradient(135deg, var(--secondary-sage), var(--accent-goldenrod));
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(138, 154, 91, 0.3);
        }
        
        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(138, 154, 91, 0.4);
        }
        
        .redirect-notice {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(0,0,0,0.1);
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        
        .countdown {
            font-weight: 700;
            color: var(--accent-goldenrod);
        }
    </style>
</head>
<body>
    <div class="thank-you-container">
        <div class="thank-you-card">
            <div class="success-icon">
                <i class="fas fa-check"></i>
            </div>
            
            <h1>Message Received!</h1>
            
            <p>
                <strong>Thank you for reaching out to us.</strong><br>
                We've received your message and will respond within 24-48 hours.
            </p>
            
            <p>
                May God's grace and peace be with you as you await our response.
            </p>
            
            <a href="index.html" class="btn-home">
                <i class="fas fa-home"></i> Return to Homepage
            </a>
            
            <div class="redirect-notice">
                <p>You'll be automatically redirected to the homepage in <span class="countdown" id="countdown">10</span> seconds...</p>
            </div>
        </div>
    </div>
    
    <script>
        // Auto-redirect countdown
        let seconds = 10;
        const countdownEl = document.getElementById('countdown');
        
        const timer = setInterval(() => {
            seconds--;
            countdownEl.textContent = seconds;
            
            if (seconds <= 0) {
                clearInterval(timer);
                window.location.href = 'index.html';
            }
        }, 1000);
    </script>
</body>
</html>
